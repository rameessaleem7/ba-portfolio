theme: jekyll-theme-modernist
title: Ramees Saleem — Business Analyst
# seo-tag builds the home page title as "title | tagline", falling back to
# `description` when no tagline is set — which produced a 135-character title.
tagline: Operations & Data
description: Business Analyst portfolio — operations, data, and Power Platform delivery in UK regulated services.
url: https://rameessaleem7.github.io
baseurl: /ba-portfolio
lang: en-GB

# seo-tag reads `image` from PAGE front matter, not site config — a site-level
# key alone emits no og:image. It is set per page via `defaults` at the bottom.
image: /assets/img/social-card.png

# Mapping, not a bare string: a string here was being read as a Twitter handle
# and rendered as twitter:creator = "@Ramees Saleem".
author:
  name: Ramees Saleem

social:
  name: Ramees Saleem
  links:
    - https://www.linkedin.com/in/ramees7
    - https://github.com/rameessaleem7

plugins:
  - jekyll-sitemap
# jekyll-seo-tag is already active — the Modernist theme calls {% seo %} in its
# layout, which is why og: tags render today. Do NOT add it to plugins as well.

show_downloads: false

exclude:
  - README.md
  - LICENSE
  - .gitignore

defaults:
  - scope:
      path: ""
    values:
      last_updated: "2026-08-04"
      # Page-level image is what makes seo-tag emit og:image and upgrade the
      # Twitter card to summary_large_image. Path must be root-relative WITHOUT
      # the baseurl — seo-tag runs it through absolute_url, which prepends
      # baseurl itself. Including it here yields /ba-portfolio/ba-portfolio/...
      image: /assets/img/social-card.png
